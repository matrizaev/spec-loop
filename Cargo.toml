[package]
name = "spec-loop"
version = "0.1.5"
edition = "2024"
rust-version = "1.89"
description = "Guarded, profile-driven implementation loop for repository specifications"
license = "MIT"

[[bin]]
name = "spec-loop"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
globset = "0.4.20"
httpdate = "1.0.3"
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std"] }
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "net", "macros"] }
toml = "1.1.8"
url = { version = "2.5.8", default-features = false, features = ["std"] }
uuid = { version = "1.29.0", default-features = false, features = ["std", "v4"] }
webbrowser = { version = "1.2.5", default-features = false }

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
