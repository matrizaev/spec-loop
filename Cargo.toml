[package]
name = "spec-loop"
version = "0.1.0"
edition = "2024"
description = "Guarded, profile-driven implementation loop for repository specifications"
license = "MIT"

[[bin]]
name = "spec-loop"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
globset = "0.4.20"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std"] }
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
