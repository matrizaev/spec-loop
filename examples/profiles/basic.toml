schema_version = 1

[specs]
active_globs = ["specs/*.md"]
id_regex = '^specs/(?P<id>[0-9]+)\.md$'
ordering = "numeric"
selection = "next"

[prompts]
implementation = ["AGENTS.md"]
review = ["AGENTS.md"]
review_status_audit = []
review_audit = ["AGENTS.md"]

[[checks]]
name = "format"
argv = ["cargo", "fmt", "--all", "--", "--check"]
cwd = "."
timeout_seconds = 300

[[checks]]
name = "tests"
argv = ["cargo", "test", "--all-targets", "--all-features"]
cwd = "."
timeout_seconds = 1800

[agent]
backend = "pi"
executable = "pi"
timeout_seconds = 3600

[completion]
max_passes = 0
commit_message = "Implement {spec_id}"

[acceptance]
manual_gates = []
