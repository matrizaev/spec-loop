schema_version = 1

[specs]
active_globs = ["specs/*.md"]
id_regex = '^specs/(?:implemented/)?(?P<id>[0-9]+)(?:-[a-z0-9-]+)?\.md$'
ordering = "numeric"
selection = "next"

[prompts]
implementation = ["AGENTS.md"]
review = ["AGENTS.md"]
review_status_audit = []
review_audit = ["AGENTS.md"]

[[checks]]
name = "make check"
argv = ["make", "check"]
cwd = "."

[agent]
backend = "pi"
executable = "pi"

[completion]
max_passes = 0
commit_message = "Implement {spec_id}"

[acceptance]
manual_gates = []

[archive]
enabled = true
destination = "specs/implemented"
