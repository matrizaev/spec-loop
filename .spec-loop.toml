schema_version = 2

[specs]
active_globs = ["specs/*.md"]
id_regex = '^specs/(?:implemented/)?(?P<id>[0-9]+)(?:-[a-z0-9-]+)?\.md$'
ordering = "numeric"
selection = "next"

[prompts]
implementation = ["AGENTS.md"]
review = ["AGENTS.md"]
review_audit = ["AGENTS.md"]

[review.context]
argv = ["git", "diff"]

[[checks]]
name = "make check"
argv = ["make", "check"]

[agent]
backend = "pi"
executable = "pi"

[completion]
max_passes = 0

[archive]
enabled = true
destination = "specs/implemented"

[[actions.on_finish]]
name = "mark archived spec complete (GNU sed)"
argv = [
  "sed",
  "-i",
  's/^\*\*Status:\*\* Active$/**Status:** Complete/',
  "{spec_path}",
]
