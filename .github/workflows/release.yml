name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.89.0

      - name: Check minimum supported Rust version
        run: cargo check --locked --all-targets --all-features

  linux-x86_64-musl:
    name: Linux x86_64 (musl)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-10-12
          targets: x86_64-unknown-linux-musl
          components: clippy, rustfmt

      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Run quality gates
        run: make check

      - name: Build release binary
        run: cargo build --locked --release --target x86_64-unknown-linux-musl --all-features

      - name: Smoke-test release binary
        run: target/x86_64-unknown-linux-musl/release/spec-loop --version

      - name: Package binary and checksum
        run: |
          asset=spec-loop-linux-x86_64-musl
          cp target/x86_64-unknown-linux-musl/release/spec-loop "$asset"
          sha256sum "$asset" > "$asset.sha256"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            spec-loop-linux-x86_64-musl
            spec-loop-linux-x86_64-musl.sha256
          fail_on_unmatched_files: true
